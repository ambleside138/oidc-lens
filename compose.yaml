name: oidc-lens

services:
  keycloak:
    build: ./infra/keycloak
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME: https://keycloak.dev.localhost:8443
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /https/local.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /https/local.key
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
    ports:
      - "127.0.0.1:8443:8443"
    networks:
      default:
        aliases:
          - keycloak.dev.localhost
    volumes:
      - ./.https/local.crt:/https/local.crt:ro
      - ./.https/local.key:/https/local.key:ro
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&3; read -r line <&3; [[ $$line == *' 200 '* ]]"]
      interval: 3s
      timeout: 3s
      retries: 30

  bff:
    build:
      context: .
      dockerfile: src/OidcLens.Bff/Dockerfile
    environment:
      ASPNETCORE_URLS: https://+:7443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/local.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: oidc-lens-local
      SSL_CERT_FILE: /https/local.crt
      Oidc__Authority: https://keycloak.dev.localhost:8443/realms/demo
      Oidc__ClientId: oidc-lens-bff
      Oidc__ClientSecret: oidc-lens-local-only
      ResourceApi__BaseAddress: https://resource-api.dev.localhost:9443
    ports:
      - "127.0.0.1:7443:7443"
    volumes:
      - ./.https/local.crt:/https/local.crt:ro
      - ./.https/local.pfx:/https/local.pfx:ro
    depends_on:
      keycloak:
        condition: service_healthy
      resource-api:
        condition: service_started

  resource-api:
    build:
      context: .
      dockerfile: src/OidcLens.ResourceApi/Dockerfile
    environment:
      ASPNETCORE_URLS: https://+:9443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/local.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: oidc-lens-local
      SSL_CERT_FILE: /https/local.crt
      Oidc__Authority: https://keycloak.dev.localhost:8443/realms/demo
      Oidc__Audience: oidc-lens-resource-api
    networks:
      default:
        aliases:
          - resource-api.dev.localhost
    volumes:
      - ./.https/local.crt:/https/local.crt:ro
      - ./.https/local.pfx:/https/local.pfx:ro
    depends_on:
      keycloak:
        condition: service_healthy
